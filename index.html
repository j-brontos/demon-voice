<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160b18"><title>Demon Voice</title><style>body{background:#160b18;color:#fff;font:16px system-ui;margin:0;padding:24px;max-width:600px;margin-inline:auto}h1{color:#f66}section{background:#29182e;border-radius:18px;padding:20px;margin:18px 0}label{display:flex;justify-content:space-between;margin:18px 0 8px}input{width:100%;accent-color:#ef4444}button{width:100%;padding:18px;border:0;border-radius:16px;background:#a21c32;color:white;font-size:20px;font-weight:bold}small{color:#d0c0d0}#status{line-height:1.5}</style></head><body><h1>😈 DEMON VOICE</h1><p>Živá změna hlasu • iPhone • Bluetooth reproduktor</p><section><label>Hloubka hlasu <b id="pitchv">−3</b></label><input id="pitch" type="range" min="-7" max="0" value="-3"><label>Zkreslení <b id="drivev">25 %</b></label><input id="drive" type="range" min="0" max="100" value="25"><label>Ozvěna <b id="echov">12 %</b></label><input id="echo" type="range" min="0" max="100" value="12"></section><button id="toggle">🎙️ Spustit mikrofon</button><section><div id="status">Připoj reproduktor přes Bluetooth, potom spusť mikrofon.</div></section><small>Používej sluchátka nebo oddal reproduktor od mikrofonu, aby nevznikala zpětná vazba. Safari musí zůstat aktivní.</small><script src="app.js"></script></body></html>
